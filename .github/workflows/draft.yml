name: Daily draft

on:
  schedule:
    # 08:00 IST, plus backup slots: GitHub often drops scheduled runs, and a run that finds
    # today's draft already made exits in seconds (see the check step).
    - cron: "30 2 * * *"   # 08:00 IST
    - cron: "5 3 * * *"    # 08:35 IST
    - cron: "40 3 * * *"   # 09:10 IST
    - cron: "20 4 * * *"   # 09:50 IST
    - cron: "10 5 * * *"   # 10:40 IST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (send nothing, commit nothing)"
        type: boolean
        default: false
      force:
        description: "Draft even if today's draft already exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: state
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || secrets.LLM_PROVIDER }}
      LLM_MODEL: ${{ vars.LLM_MODEL || secrets.LLM_MODEL }}
      LLM_FALLBACK_MODEL: ${{ vars.LLM_FALLBACK_MODEL || secrets.LLM_FALLBACK_MODEL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT || secrets.REDDIT_USER_AGENT }}
      AUTHOR_NAME: ${{ vars.AUTHOR_NAME || secrets.AUTHOR_NAME }}
      POST_MODE: ${{ vars.POST_MODE || secrets.POST_MODE }}
      REMINDER_HOURS: ${{ vars.REMINDER_HOURS }}
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_TOKEN_ISSUED: ${{ vars.LINKEDIN_TOKEN_ISSUED || secrets.LINKEDIN_TOKEN_ISSUED }}
      LINKEDIN_VERSION: ${{ vars.LINKEDIN_VERSION || secrets.LINKEDIN_VERSION }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check whether today's draft is still needed
        id: check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then python -m src.main_draft --check; else echo "needed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Cache Playwright browsers
        if: steps.check.outputs.needed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium
        if: steps.check.outputs.needed == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Draft
        if: steps.check.outputs.needed == 'true'
        run: python -m src.main_draft ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.force && '--force' || '' }}

      - name: Commit state
        if: ${{ always() && !inputs.dry_run && steps.check.outputs.needed == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then echo "No state changes"; exit 0; fi
          git commit -m "state: daily draft $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
