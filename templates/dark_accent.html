<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Inter"; src: url("{{FONT_INTER}}") format("truetype"); font-weight: 100 900; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; }
  body {
    background: #18191C;
    color: #F2EFE9;
    font-family: "Inter", sans-serif;
    padding: 112px;
    display: flex;
    flex-direction: column;
  }
  .headline-box {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
    min-height: 0;
    padding-bottom: 72px;
  }
  .headline {
    font-size: 100px;
    font-weight: 700;
    line-height: 1.08;
    letter-spacing: -0.03em;
    text-wrap: balance;
    overflow-wrap: break-word;
  }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-top: 1px solid rgba(242, 239, 233, 0.16);
    padding-top: 36px;
  }
  .source {
    font-size: 26px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #E8A87C;
  }
  .author {
    font-size: 26px;
    font-weight: 500;
    color: rgba(242, 239, 233, 0.6);
  }
</style>
</head>
<body>
  <div class="headline-box">
    <div class="headline">{{HEADLINE}}</div>
  </div>
  <div class="footer">
    <div class="source">{{SOURCE}}</div>
    <div class="author">{{AUTHOR}}</div>
  </div>
</body>
</html>
